<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>哈哈哈哈哈哈哈</title>

<!-- 分享卡片上只显示「...」—— 写「哈哈哈哈哈哈哈」会在微信里提前剧透 -->
<meta property="og:title" content="...">
<meta property="og:description" content="">
<meta name="theme-color" content="#fffbe8">
<meta name="robots" content="noindex, nofollow">

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #fffbe8;
    font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI Emoji",
                 system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    cursor: pointer;
  }

  /* 每条都是一小段文字，用 transform 平移（走 GPU，几百条一起飘也不卡） */
  .bit {
    position: absolute;
    white-space: nowrap;
    line-height: 1;
    will-change: transform;
    pointer-events: none;      /* 别挡点击 */
  }
</style>

<body>
<script>
"use strict";

const body = document.body;

/* ---------------------------------------------------------------
   飘什么内容

   想改文案就改这个数组。表情直接用 emoji 就行 ——
   系统自带字体里有，不用额外加载任何东西。
   --------------------------------------------------------------- */
const TEXTS = [
  // 纯「哈」
  "哈哈", "哈哈", "哈哈哈", "哈哈哈", "哈哈哈哈", "哈哈哈哈哈",
  // 带口头语
  "笑死", "笑死我了", "绷不住了", "我不行了", "鹅鹅鹅",
  // 纯表情
  "😂", "🤣", "😆", "😄", "😁", "💀", "🤡", "😹",
  // 混搭（占多数，看起来最像聊天）
  "哈哈😂", "哈哈哈🤣", "哈哈哈哈😆", "笑死😂", "哈哈哈💀",
  "哈哈哈哈哈哈", "😆哈哈", "🤣哈哈哈", "嘿嘿😁", "哈哈😄",
  "🤣🤣", "😂😂😂", "哈哈哈哈🤣😂",
];

// 颜色：暖色为主，偶尔跳个冷色
const COLORS = [
  "#c96a12", "#d9820a", "#b8452f", "#c93b3b", "#8a6b1f",
  "#1a9a4f", "#2f9e8f", "#4084ff", "#8b5cf6", "#c2478f",
];

const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[(Math.random() * a.length) | 0];

/** 聊天字号：手机上也不会小到看不清，电脑上也不会大到糊脸。 */
function fontSize() {
  const m = Math.min(window.innerWidth, window.innerHeight);
  return Math.round(Math.max(14, Math.min(21, m * 0.016)) + rand(-2, 3));
}

/* ---------------------------------------------------------------
   泳道：把屏幕横着切成很多条，同一条短时间内不重复用
   —— 不这么做的话，几百条小字会随机叠在一起糊成一团
   --------------------------------------------------------------- */
let lanes = [];
function rebuildLanes() {
  const h = window.innerHeight;
  const step = 26;                       // 约一行小字的高度
  const n = Math.max(6, Math.floor(h / step));
  lanes = new Array(n).fill(0);          // 每条泳道「下次可用时间」
}
rebuildLanes();

function pickLane() {
  const now = performance.now();
  const free = [];
  for (let i = 0; i < lanes.length; i++) if (lanes[i] <= now) free.push(i);
  const lane = free.length ? pick(free) : (Math.random() * lanes.length) | 0;
  lanes[lane] = now + rand(250, 1100);   // 随机占用一会儿
  return lane;
}

/* ---------------------------------------------------------------
   放一条出去
   --------------------------------------------------------------- */
function spawn(opts = {}) {
  const W = window.innerWidth;
  const H = window.innerHeight;

  const el = document.createElement("span");
  el.className = "bit";
  el.textContent = opts.text || pick(TEXTS);

  const fs = opts.size || fontSize();
  el.style.fontSize = fs + "px";
  el.style.color = opts.color || pick(COLORS);

  // 透明度分三档 —— 有的清楚有的淡，看起来有远近层次，不像贴纸
  const r = Math.random();
  el.style.opacity = opts.opacity != null ? opts.opacity
    : r < 0.55 ? rand(0.75, 1)      // 多数清晰
    : r < 0.88 ? rand(0.45, 0.72)   // 一部分淡
    : rand(0.18, 0.4);              // 少数很淡，做背景

  const lane = pickLane();
  const y = lane * 26 + rand(-4, 4);
  el.style.top = Math.max(0, Math.min(H - fs - 2, y)) + "px";

  body.appendChild(el);

  const w = el.offsetWidth || fs * 3;

  // 左右双向，交错着飘才不呆板
  const ltr = Math.random() < 0.5;
  const startX = ltr ? -w - 8 : W + 8;
  const endX = ltr ? W + 8 : -w - 8;
  el.style.transform = `translateX(${startX}px)`;

  // 速度：小字慢一点像聊天，偶尔来一条快的
  const fast = Math.random() < 0.12;
  const speed = opts.speed || (fast ? rand(260, 420) : rand(45, 130));
  const dist = Math.abs(endX - startX);
  const a = el.animate(
    [{ transform: `translateX(${startX}px)` },
     { transform: `translateX(${endX}px)` }],
    { duration: (dist / speed) * 1000, easing: "linear", fill: "forwards" }
  );
  a.onfinish = () => el.remove();
  a.oncancel = () => el.remove();
}

/* ---------------------------------------------------------------
   自动飘
   --------------------------------------------------------------- */
let timer = null;
let running = true;
const MAX = 190;              // 同屏上限，低端手机的保护线

function start() {
  if (timer) return;
  running = true;
  const tick = () => {
    if (!running) return;
    const n = body.childElementCount;
    if (n < MAX) {
      spawn();
      // 屏幕上太空就一次多放几条，开头不至于空白
      if (n < 40) { spawn(); spawn(); }
    }
    // 字小、数量多，节奏比大字版快一些
    timer = setTimeout(tick, rand(45, 150));
  };
  tick();
}

function stop() {
  running = false;
  clearTimeout(timer);
  timer = null;
}

/* ---------------------------------------------------------------
   点一下：从手指位置炸出一堆
   --------------------------------------------------------------- */
function burst(cx, cy) {
  const n = 22;
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const el = document.createElement("span");
      el.className = "bit";
      el.textContent = pick(TEXTS);
      const fs = fontSize();
      el.style.fontSize = fs + "px";
      el.style.color = pick(COLORS);
      el.style.opacity = rand(0.7, 1);
      el.style.top = Math.max(0, Math.min(window.innerHeight - fs - 2,
        cy + rand(-70, 70))) + "px";
      body.appendChild(el);

      const w = el.offsetWidth || fs * 3;
      const toRight = cx < window.innerWidth / 2;
      const startX = toRight ? cx - w : cx;
      const endX = toRight ? window.innerWidth + 8 : -w - 8;
      el.style.transform = `translateX(${startX}px)`;
      const a = el.animate(
        [{ transform: `translateX(${startX}px)` },
         { transform: `translateX(${endX}px)` }],
        { duration: rand(1600, 3600), easing: "linear", fill: "forwards" }
      );
      a.onfinish = () => el.remove();
      a.oncancel = () => el.remove();
    }, i * 32);
  }
}

document.addEventListener("pointerdown", (e) => burst(e.clientX, e.clientY));

/* ---------------------------------------------------------------
   省电 & 尺寸变化
   --------------------------------------------------------------- */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stop(); else start();
});

let rt = null;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    for (const el of [...body.children]) el.remove();
    rebuildLanes();
  }, 260);
});

start();
</script>
</body>
