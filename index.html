<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>哈哈哈哈哈哈哈</title>

<!-- 分享卡片只显示「...」，不剧透 -->
<meta property="og:title" content="...">
<meta property="og:description" content="">
<meta name="theme-color" content="#1a0810">
<meta name="robots" content="noindex, nofollow">

<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    /* 暗底暖色 —— 亮字才能在暗处"发光"，远近才有退路 */
    background: #12040a;
    background-image:
      radial-gradient(ellipse 90% 70% at 50% 42%, #3a0f1e 0%, #1d0710 45%, #0a0206 100%);
    font-family: "Microsoft YaHei UI", "PingFang SC", "Heiti SC",
                 "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    cursor: pointer;
  }

  /* 一小段字，从屏幕一边飘到另一边。
     用纯 CSS 动画（element.animate() 要 iOS 13.1+，旧手机会整页空白）。 */
  .bit {
    position: absolute;
    left: 0;
    white-space: nowrap;
    line-height: 1;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    -webkit-animation-timing-function: linear;
    -webkit-animation-fill-mode: forwards;
    pointer-events: none;
    font-weight: 900;
    letter-spacing: .02em;
  }

  @keyframes flyLtr {
    from { -webkit-transform: translateX(-105%); transform: translateX(-105%); }
    to   { -webkit-transform: translateX(100vw);  transform: translateX(100vw); }
  }
  @keyframes flyRtl {
    from { -webkit-transform: translateX(100vw);  transform: translateX(100vw); }
    to   { -webkit-transform: translateX(-105%); transform: translateX(-105%); }
  }
  .ltr { -webkit-animation-name: flyLtr; animation-name: flyLtr; }
  .rtl { -webkit-animation-name: flyRtl; animation-name: flyRtl; }

  /* ---------- 四种字效，混着用才"花" ---------- */

  /* 发光：近处用，最抢眼 */
  .s-glow {
    text-shadow: 0 0 8px currentColor, 0 0 20px currentColor;
  }

  /* 渐变彩虹：字体本身带色带 */
  .s-grad {
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }

  /* 空心气球字：只描边不填色 */
  .s-hollow {
    color: transparent;
    -webkit-text-fill-color: transparent;
  }

  /* 远处的：不加任何特效，自然退到暗处 */
  .s-plain { }

  /* 小装饰，散布在文字之间 */
  .deco {
    position: absolute;
    pointer-events: none;
    line-height: 1;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    -webkit-animation-timing-function: linear;
    -webkit-animation-fill-mode: forwards;
  }

  /* ---------- 声音开关 ---------- */
  /* 声音是**自动开**的，这个按钮只是"想安静时点一下"。
     所以平时它非常淡（35% 透明），不抢戏。 */
  #snd {
    position: fixed;
    right: 10px; bottom: 10px;
    z-index: 9999;
    width: 34px; height: 34px;
    line-height: 1;
    font-size: 15px;
    padding: 0;
    border: 1px solid rgba(255, 110, 160, .28);
    border-radius: 50%;
    background: rgba(30, 6, 16, .4);
    color: #ff9ec4;
    cursor: pointer;
    opacity: .35;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    -webkit-transition: opacity .3s, background .2s;
    transition: opacity .3s, background .2s;
    -webkit-user-select: none; user-select: none;
    font-family: inherit;
  }
  #snd:hover, #snd:active { opacity: .9; background: rgba(60, 12, 30, .7); }

  /* ---------- 声音没起来时的提示 ---------- */
  /* 浏览器禁止网页自动出声，必须有**一次真实交互**（点/摸/滚/按键）。
     我们一进页面就自动尝试了；万一被拦，隔 1.6 秒浮出这条提示告诉用户
     该怎么办 —— 而不是让他以为"这页面坏了"。
     一旦真的响了，它立刻消失。 */
  #hint {
    position: fixed;
    left: 50%; bottom: 18px;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    z-index: 9998;
    padding: 8px 16px;
    border: 1px solid rgba(255, 110, 160, .5);
    border-radius: 999px;
    background: rgba(36, 8, 18, .8);
    color: #ffc2d8;
    font-size: 13px;
    font-family: inherit;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    -webkit-transition: opacity .5s;
    transition: opacity .5s;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  #hint.show { opacity: 1; }
  @keyframes hintPulse {
    0%, 100% { -webkit-transform: translateX(-50%) scale(1);
               transform: translateX(-50%) scale(1); }
    50%      { -webkit-transform: translateX(-50%) scale(1.04);
               transform: translateX(-50%) scale(1.04); }
  }
  #hint.show {
    -webkit-animation: hintPulse 1.6s ease-in-out infinite;
    animation: hintPulse 1.6s ease-in-out infinite;
  }

  #fallback {
    position: absolute; inset: 0;
    display: -webkit-box; display: flex;
    -webkit-box-align: center; align-items: center;
    -webkit-box-pack: center; justify-content: center;
    font-size: 12vw; color: #ff5c8a; letter-spacing: .05em;
    text-shadow: 0 0 24px currentColor;
    text-align: center; padding: 5vw;
    -webkit-box-sizing: border-box; box-sizing: border-box;
  }
</style>

<body>
<div id="fallback">哈哈哈哈哈哈哈😂🤣</div>
<button id="snd" type="button" title="声音开关">
  <span class="ico">🔊</span>
</button>
<div id="hint"></div>

<script>
"use strict";

/* 全部 ES5 —— 旧手机遇到箭头函数 / const / 模板字符串会直接语法报错 */
try {

  var body = document.body;

  /* -------------------------------------------------------------
     飘什么
     ------------------------------------------------------------- */
  var TEXTS = [
    // 各种「哈」
    "哈", "哈哈", "哈哈哈", "哈哈哈哈", "哈哈哈哈哈", "哈哈哈哈哈哈",
    "哈哈哈哈哈哈嗝",
    // 带波浪号（照那张图的风格，满屏 〜）
    "哈哈〜", "哈哈哈～", "哈哈哈哈〜〜", "笑死〜〜", "嘿嘿〜〜",
    "哈哈哈哈〜", "哈哈哈～～",
    // 口头语
    "笑死", "笑死我了", "绷不住了", "笑不活了", "笑疯了",
    "鹅鹅鹅", "我不行了",
    /* 嘲笑向的词。
       ——注意：这里是**嘲笑**，不是别的意思。
       爱心、蝴蝶结这类会让人想歪的一律不放。 */
    "就这？", "哈哈就这", "笑死，就这", "啊这", "典", "就这啊",
    // 笑哭脸
    "\uD83D\uDE02", "\uD83E\uDD23", "\uD83D\uDE06", "\uD83D\uDE04",
    "\uD83D\uDE01", "\uD83D\uDE39", "\uD83D\uDE2D", "\uD83D\uDE05",
    // 闪光（纯装饰，不暧昧）
    "\u2728", "\u2B50", "\uD83C\uDF1F", "\uD83D\uDCAB",
    "\uD83C\uDF89", "\uD83C\uDF8A",
    // 别的表情（💀=笑死 🃏=小丑 👎=不行 🙅=别说了）
    "\uD83D\uDC80", "\uD83E\uDD21", "\uD83D\uDC7B", "\uD83D\uDE48",
    "\uD83D\uDC4E", "\uD83D\uDE45",
    // 混搭（占多数）
    "哈哈\uD83D\uDE02", "哈哈哈\uD83E\uDD23", "笑死\uD83D\uDE02",
    "哈哈\u2728", "嘿嘿\uD83D\uDE01", "就这\uD83E\uDD21",
    "\uD83D\uDE02\uD83D\uDE02\uD83D\uDE02",
    "笑不活了\uD83E\uDD23", "哈哈哈哈哈\uD83C\uDF89",
    "\uD83E\uDD23\uD83E\uDD23\uD83E\uDD23", "\uD83D\uDC80\uD83D\uDC80"
  ];

  /* 颜色多给一些 —— 暗底上饱和度高才好看 */
  var COLORS = [
    "#ff5c8a", "#ff2e63", "#ff6b9d", "#ff9ec4", "#ff4d6d",   // 粉红系
    "#ff8a3d", "#ffb347", "#ffd93d",                          // 橙黄
    "#5ee7df", "#4dd0ff", "#7aa2ff", "#38bdf8",               // 青蓝
    "#c084fc", "#e879f9", "#a78bfa",                          // 紫
    "#7bed9f", "#ffffff"                                      // 绿白
  ];

  /* 花哨字体：Windows 上认这些就很有味道，手机上自动退回系统字体 */
  var FONTS = [
    '"Microsoft YaHei UI","PingFang SC",sans-serif',
    '"YouYuan","幼圆","Microsoft YaHei UI",sans-serif',
    '"STXinwei","华文新魏","Microsoft YaHei UI",sans-serif',
    '"STHupo","华文琥珀","Microsoft YaHei UI",sans-serif',
    '"FZShuTi","方正舒体","Microsoft YaHei UI",sans-serif',
    '"STKaiti","楷体","Microsoft YaHei UI",sans-serif',
    '"SimHei","黑体","Microsoft YaHei UI",sans-serif'
  ];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }

  /* -------------------------------------------------------------
     远近层次 —— 这是这张图最关键的东西

     真实世界里判断远近靠四条线索，这里全都用上：
       1. 大小：近的大，远的小
       2. 亮度：近的亮，远的暗（大气透视）
       3. 速度：近的快，远的慢  ← **视差**，这条最能骗过眼睛
       4. 特效：近的有辉光，远的什么都不加，自然退到暗处
     ------------------------------------------------------------- */
  function depthOf() {
    // 平方分布 —— 让"远"的（小字）占多数，像图里那样密密麻麻
    var d = Math.random();
    return d * d;
  }

  function sizeOf(depth) {
    var m = Math.min(window.innerWidth, window.innerHeight);
    // 远：约 13px 起；近：能到屏宽的 13% 左右
    var lo = Math.max(12, m * 0.018);
    var hi = Math.max(28, m * 0.13);
    return Math.round(lo + (hi - lo) * depth);
  }

  function styleOf(depth, el, fs, color) {
    var r = Math.random();
    var cls;
    // 远处的（depth 小）：不加特效，靠"什么都没加"退到背景里
    if (depth < 0.30) {
      cls = "s-plain";
    } else if (r < 0.46) {
      cls = "s-glow";
    } else if (r < 0.72) {
      cls = "s-grad";
      // 渐变：随便挑两个颜色组成一条色带
      var a = pick(COLORS), b2 = pick(COLORS);
      var ang = (Math.random() * 180) | 0;
      el.style.backgroundImage = "linear-gradient(" + ang + "deg," + a + "," + b2 + ")";
    } else {
      cls = "s-hollow";
      // 空心字必须显式给描边色 —— color 已经是 transparent，
      // 用 currentColor 会连描边一起透明掉
      el.style.webkitTextStrokeColor = color;
      el.style.webkitTextStrokeWidth =
        Math.max(1, Math.min(3.4, fs * 0.055)) + "px";
    }
    return cls;
  }

  /* -------------------------------------------------------------
     泳道：横着切条，同一条短时间内不重复用，避免叠成一坨
     ------------------------------------------------------------- */
  var lanes = [];
  var LANE_H = 30;

  function rebuildLanes() {
    var n = Math.max(6, Math.floor(window.innerHeight / LANE_H));
    lanes = [];
    for (var i = 0; i < n; i++) lanes.push(0);
  }
  rebuildLanes();

  function pickLane() {
    var now = Date.now();
    var free = [];
    for (var i = 0; i < lanes.length; i++) {
      if (lanes[i] <= now) free.push(i);
    }
    var lane = free.length ? pick(free) : ((Math.random() * lanes.length) | 0);
    lanes[lane] = now + rand(200, 900);
    return lane;
  }

  /* -------------------------------------------------------------
     放一条出去
     ------------------------------------------------------------- */
  function spawn(opts) {
    opts = opts || {};
    var W = window.innerWidth;
    var H = window.innerHeight;

    var depth = (opts.depth != null) ? opts.depth : depthOf();
    var fs = sizeOf(depth);
    var color = pick(COLORS);

    var el = document.createElement("span");
    el.textContent = opts.text || pick(TEXTS);
    el.style.fontSize = fs + "px";
    el.style.color = color;
    el.style.fontFamily = opts.font || pick(FONTS);

    // 亮度随远近：近的几乎不透明，远的很淡
    el.style.opacity = (0.20 + depth * 0.80) * rand(0.88, 1);

    // 近的盖在远的上面
    el.style.zIndex = Math.round(depth * 100);

    // 字效
    var cls = styleOf(depth, el, fs, color);
    el.className = "bit " + cls;

    var lane = pickLane();
    var y = lane * LANE_H + rand(-5, 5);
    el.style.top = Math.max(0, Math.min(H - fs - 2, y)) + "px";

    // 左右双向交错
    var ltr = Math.random() < 0.5;
    el.className += ltr ? " ltr" : " rtl";

    /* **视差**：近的飘得快，远的飘得慢。
       这一条是"层次感"的灵魂 —— 大小和亮度只是静态的，
       速度差才让人眼真的觉得有纵深。 */
    var speed = opts.speed || (18 + depth * depth * 240);
    if (Math.random() < 0.08) speed *= rand(2, 3.2);   // 偶尔来一条窜过去的
    var dur = ((W + 260) / speed) * 1000;
    el.style.animationDuration = dur + "ms";
    el.style.webkitAnimationDuration = dur + "ms";
    el.style.animationDelay = (-Math.random() * dur * 0.85) + "ms";

    var onEnd = function () {
      if (el.parentNode) el.parentNode.removeChild(el);
      el.removeEventListener("webkitAnimationEnd", onEnd);
      el.removeEventListener("animationend", onEnd);
    };
    el.addEventListener("webkitAnimationEnd", onEnd);
    el.addEventListener("animationend", onEnd);

    body.appendChild(el);
  }

  /* 偶尔飘过一些孤零零的小装饰（〜 丶 ✨），像图里那样散布在字缝里 */
  function spawnDeco() {
    var W = window.innerWidth, H = window.innerHeight;
    var pool = ["\u301C", "~", "\uFE4F", "\u2728", "\u30FB", "\uFF5E"];
    var el = document.createElement("span");
    el.className = "deco";
    el.textContent = pick(pool);
    var fs = rand(12, 34);
    el.style.fontSize = fs + "px";
    el.style.color = pick(COLORS);
    el.style.opacity = rand(0.25, 0.7);
    el.style.top = rand(0, H - fs) + "px";
    var ltr = Math.random() < 0.5;
    el.className = "deco " + (ltr ? "ltr" : "rtl");
    var dur = rand(4000, 12000);
    el.style.animationDuration = dur + "ms";
    el.style.webkitAnimationDuration = dur + "ms";
    el.style.animationDelay = (-Math.random() * dur * 0.8) + "ms";
    var onEnd = function () {
      if (el.parentNode) el.parentNode.removeChild(el);
      el.removeEventListener("webkitAnimationEnd", onEnd);
      el.removeEventListener("animationend", onEnd);
    };
    el.addEventListener("webkitAnimationEnd", onEnd);
    el.addEventListener("animationend", onEnd);
    body.appendChild(el);
  }

  /* -------------------------------------------------------------
     主循环
     ------------------------------------------------------------- */
  var timer = null;
  var running = true;
  var MAX = 180;

  function countBits() {
    var n = 0, kids = body.children;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].className &&
          String(kids[i].className).indexOf("s-") >= 0) n++;
    }
    return n;
  }

  function tick() {
    if (!running) return;
    if (body.childElementCount < MAX) {
      spawn();
      if (body.childElementCount < 45) { spawn(); spawn(); }
      if (Math.random() < 0.22) spawnDeco();
    }
    timer = setTimeout(tick, rand(40, 140));
  }

  function start() {
    if (timer) return;
    running = true;
    var fb = document.getElementById("fallback");
    if (fb) fb.style.display = "none";
    tick();
  }

  function stop() {
    running = false;
    if (timer) clearTimeout(timer);
    timer = null;
  }

  /* -------------------------------------------------------------
     点一下：从手指位置炸出一簇（按远近随机，看着像涌出来）
     ------------------------------------------------------------- */
  function burst(cx, cy) {
    for (var i = 0; i < 24; i++) {
      (function (i) {
        setTimeout(function () {
          var depth = depthOf();
          var fs = sizeOf(depth);
          var el = document.createElement("span");
          el.textContent = pick(TEXTS);
          el.style.fontSize = fs + "px";
          var color = pick(COLORS);
          el.style.color = color;
          el.style.fontFamily = pick(FONTS);
          el.style.opacity = 0.35 + depth * 0.65;
          el.style.zIndex = 200 + Math.round(depth * 100);
          el.style.top = Math.max(0, Math.min(window.innerHeight - fs - 2,
            cy + rand(-90, 90))) + "px";
          var toRight = cx < window.innerWidth / 2;
          el.className = "bit " + styleOf(depth, el, fs, color) +
            (toRight ? " ltr" : " rtl");
          var dur = rand(1400, 4200);
          el.style.animationDuration = dur + "ms";
          el.style.webkitAnimationDuration = dur + "ms";
          el.style.animationDelay = "0ms";
          var onEnd = function () {
            if (el.parentNode) el.parentNode.removeChild(el);
            el.removeEventListener("webkitAnimationEnd", onEnd);
            el.removeEventListener("animationend", onEnd);
          };
          el.addEventListener("webkitAnimationEnd", onEnd);
          el.addEventListener("animationend", onEnd);
          body.appendChild(el);
        }, i * 28);
      })(i);
    }
  }

  /* =============================================================
     声音：现场合成一段马戏团手摇风琴（calliope）循环

     为什么不用音频文件：
       · 不用下载任何东西，**断网也能响**
       · 没有版权问题
       · 整个"音源"就是下面这几十行，比一个 mp3 还小

     音色怎么来的：手摇风琴是蒸汽吹哨片，声音**又亮又有点跑调**。
     所以用方波（谐波多，像哨音）+ 两个略微失谐的振荡器叠加，
     再加一个低音做"蹦蹦"的伴奏。
     ============================================================= */
  var Audio = (function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = null, master = null;
    var started = false, muted = false;
    var timer = null, step = 0;

    var VOL = 0.42;                  // 正常音量（淡入到这里）

    var dry = null, wet = null;
    var fadedIn = false;
    var lastErr = "无";

    /* ---- 真实录音（sounds/laugh.mp3）----
       加载成功就循环放它；加载失败才退回下面那套合成笑声。
       这样"文件没传上去""网络不好"之类的意外不会导致一片死寂。 */
    var laughBuf = null;     // 解码后的音频
    var laughSrc = null;     // 正在循环的播放源
    var useSynth = false;    // true = 用合成笑声兜底
    var laughTried = false;

    /* ---------------------------------------------------------
       加载真实录音

       用 Web Audio 而不是 <audio> 标签，有三个原因：
         · 能复用现有那套"解锁 + 淡入"的逻辑，不用再对付一遍自动播放策略
         · 能接到同一条延迟线上，跟其他声音的空间感一致
         · 循环点可控（<audio loop> 在有些浏览器上接缝会有咔哒声）
       --------------------------------------------------------- */
    function startRealLoop() {
      if (laughSrc || !laughBuf || muted) return;
      if (!ctx || ctx.state !== "running") return;
      try {
        var src = ctx.createBufferSource();
        src.buffer = laughBuf;
        src.loop = true;
        src.connect(dry);
        src.connect(wet);
        src.start(0);
        laughSrc = src;
        useSynth = false;
      } catch (e) {
        useSynth = true;
        lastErr = "playReal: " + (e && e.message ? e.message : e);
      }
    }

    function decodeAudio(buf, ok, fail) {
      // 新浏览器返回 Promise；老 Safari 只认回调。两边都照顾。
      var done = false;
      function once(fn, arg) { if (!done) { done = true; fn(arg); } }
      try {
        var p = ctx.decodeAudioData(
          buf,
          function (d) { once(ok, d); },
          function (e) { once(fail, e); }
        );
        if (p && p.then) {
          p.then(function (d) { once(ok, d); },
                 function (e) { once(fail, e); });
        }
      } catch (e) {
        once(fail, e);
      }
    }

    function loadReal() {
      if (laughTried || !ctx) return;
      laughTried = true;
      if (!window.fetch) { useSynth = true; return; }
      try {
        fetch("sounds/laugh.mp3")
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.arrayBuffer();
          })
          .then(function (buf) {
            decodeAudio(buf,
              function (d) {
                laughBuf = d;
                // 已经在响了就直接接上，否则等 fadeIn 时再起
                if (ctx.state === "running" && fadedIn) startRealLoop();
              },
              function (e) {
                useSynth = true;
                lastErr = "decode: " + (e && e.message ? e.message : e);
              });
          })
          .catch(function (e) {
            useSynth = true;
            lastErr = "fetch: " + (e && e.message ? e.message : e);
          });
      } catch (e) {
        useSynth = true;
      }
    }

    /* ---------------------------------------------------------
       合成笑声（兜底）—— 真实录音加载不出来时才用
       --------------------------------------------------------- */

    /** 一个"嘿" */
    function heh(t, base, vol) {
      var o = ctx.createOscillator();
      var f = ctx.createBiquadFilter();
      var g = ctx.createGain();

      o.type = "triangle";
      // 先往上挑一点再滑下来 —— 像笑的时候嗓子那一下抖动
      o.frequency.setValueAtTime(base * 1.18, t);
      o.frequency.exponentialRampToValueAtTime(base * 1.32, t + 0.035);
      o.frequency.exponentialRampToValueAtTime(base * 0.86, t + 0.16);

      // 带通放在第二谐波附近，声音就"有人味"了
      f.type = "bandpass";
      f.frequency.value = base * 2.1;
      f.Q.value = 2.2;

      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0004, t + 0.19);

      o.connect(f); f.connect(g); g.connect(dry); g.connect(wet);
      o.start(t); o.stop(t + 0.22);
    }

    /** 一串笑：4~7 个"嘿"，音高一个个往下掉（真笑就是越笑越低） */
    function laughBurst(t0) {
      var n = 4 + ((Math.random() * 4) | 0);
      var base = 390 + Math.random() * 110;      // 每串换个调，不然听着像复读
      var gap = 0.125 + Math.random() * 0.055;   // 越笑越快
      for (var i = 0; i < n; i++) {
        heh(t0 + i * gap * (1 - i * 0.05),
            base * (1 - i * 0.038),
            (0.17 - i * 0.014) * (0.85 + Math.random() * 0.3));
      }
      return n * gap;
    }

    /* ---------------------------------------------------------
       排下一串笑
       间隔随机 1.1~3.2 秒 —— 一直不停会吵，留点空档才像"偶尔笑一下"
       --------------------------------------------------------- */
    var nextLaugh = 0;

    function schedule() {
      if (!ctx) return;
      // 被浏览器挂起时**不要排音** —— 那会排出一堆"过去的时间"，
      // 等真正响起来的时候全部挤在一起炸出来。
      if (ctx.state !== "running") return;
      if (!useSynth) return;      // 用着真实录音，就不用合成了
      if (!nextLaugh) nextLaugh = ctx.currentTime + 0.25;
      var ahead = 1.2;
      while (nextLaugh < ctx.currentTime + ahead) {
        var dur = laughBurst(nextLaugh);
        // 笑完歇一下再笑
        nextLaugh += dur + 1.1 + Math.random() * 2.1;
        step++;
      }
    }

    function loop() {
      schedule();
      timer = setTimeout(loop, 120);
    }

    /**
     * 把主音量从 0 淡到 VOL。
     *
     * ⚠ 这一行**绝对不能少** —— 踩过的坑：boot() 里把 gain 设成 0
     * 准备淡入，却忘了写淡入本身，于是音乐一直在正常调度、
     * 计算全对、**就是一点声音都没有**，而且不报任何错。
     */
    function fadeIn() {
      if (fadedIn || !ctx || muted) return;
      if (ctx.state !== "running") return;
      try {
        var t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(VOL, t + 1.6);
        fadedIn = true;
      } catch (e) {}
      // 淡入的同时把声音接上：成功就是真实录音循环，失败才用合成
      if (!startRealLoopSafe()) useSynth = true;
    }

    /** 试着起真实录音；成了返回 true */
    function startRealLoopSafe() {
      if (laughBuf) { startRealLoop(); return true; }
      return false;
    }

    return {
      /**
       * 建好音频引擎并把音乐排上。
       *
       * **一进页面就调它**（不需要用户先点）。浏览器多半会把 AudioContext
       * 建在 "suspended" 状态，那就什么也听不到 —— 这时再等任意一次
       * 交互去 resume()。这样"打开就响"和"浏览器不许自动播放"两头都占。
       */
      boot: function () {
        if (started || !AC) return false;
        try {
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0;                 // 从 0 淡入，别一上来"啪"一声
          master.connect(ctx.destination);

          // 一条延迟线做空间感 —— 比正经混响便宜得多，轻音乐够用了
          var delay = ctx.createDelay(1.0);
          delay.delayTime.value = 0.32;
          var fb = ctx.createGain();
          fb.gain.value = 0.28;
          wet = ctx.createGain();
          wet.gain.value = 0.34;
          delay.connect(fb); fb.connect(delay);
          delay.connect(master);
          wet.connect(delay);

          dry = ctx.createGain();
          dry.gain.value = 1;
          dry.connect(master);

          nextLaugh = 0;          // 排程起点，第一次 schedule() 时再定
          started = true;
          // 先把真实录音拉下来（解码不影响后面的解锁流程）
          loadReal();
          loop();
          this.resume();          // resume 里会负责淡入
          return true;
        } catch (e) {
          lastErr = "boot: " + (e && e.message ? e.message : e);
          return false;
        }
      },
      /** 被浏览器挂起时，靠一次用户交互把它唤醒，然后淡入 */
      resume: function () {
        if (!ctx) return;
        var self = this;
        try {
          if (ctx.state === "suspended" && ctx.resume) {
            var p = ctx.resume();
            if (p && p.then) {
              p.then(function () { fadeIn(); },
                     function (e2) {
                       lastErr = "resume 被拒: " +
                         (e2 && e2.message ? e2.message : e2);
                     });
            } else {
              setTimeout(function () { fadeIn(); }, 120);
            }
          } else if (ctx.state === "running") {
            fadeIn();
          }
        } catch (e) {
          lastErr = "resume: " + (e && e.message ? e.message : e);
        }
        return self;
      },
      /** 真的在响吗（而不是"建好了但被挂着"） */
      isPlaying: function () {
        return started && !!ctx && ctx.state === "running" && !muted;
      },
      toggle: function () {
        if (!started) { return this.boot(); }
        muted = !muted;
        try {
          master.gain.cancelScheduledValues(ctx.currentTime);
          master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        } catch (e) {}
        master.gain.linearRampToValueAtTime(muted ? 0 : VOL,
          ctx.currentTime + 0.3);
        return !muted;
      },
      isStarted: function () { return started; },
      isMuted: function () { return muted; },
      /** 给调试面板用：真实的音频状态 */
      state: function () { return ctx ? ctx.state : "(还没建)"; },
      vol: function () {
        try { return master ? master.gain.value.toFixed(3) : "-"; }
        catch (e) { return "-"; }
      },
      lastError: function () { return lastErr; },
      /** 点屏幕时的"叮"一声，很轻，配轻音乐 */
      blip: function () {
        if (!started || muted || !ctx || ctx.state !== "running") return;
        try {
          var t = ctx.currentTime;
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(1320, t);
          o.frequency.exponentialRampToValueAtTime(1760, t + 0.08);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.05, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0004, t + 0.3);
          o.connect(g); g.connect(dry); g.connect(wet);
          o.start(t); o.stop(t + 0.32);
        } catch (e) {}
      }
    };
  })();

  /* -------------------------------------------------------------
     调试面板：只在网址后面加 ?debug=1 才出现
     平时完全不显示，不影响发给朋友。
     用来远程排查"为什么没声音"—— 把屏幕上的字念给我就行。
     ------------------------------------------------------------- */
  var DEBUG = /[?&]debug=1/.test(window.location.search);
  var dbgEl = null;
  if (DEBUG) {
    dbgEl = document.createElement("div");
    dbgEl.style.cssText =
      "position:fixed;left:8px;top:8px;right:8px;z-index:99999;" +
      "background:rgba(0,0,0,.85);color:#7CFC98;" +
      "font:11.5px/1.65 ui-monospace,Menlo,Consolas,monospace;" +
      "padding:10px 12px;border-radius:8px;white-space:pre-wrap;" +
      "word-break:break-all;pointer-events:none";
    document.body.appendChild(dbgEl);
  }
  function refreshDebug() {
    if (!dbgEl) return;
    var hasAC = !!(window.AudioContext || window.webkitAudioContext);
    var lines = [
      "\u2500\u2500 \u58F0\u97F3\u8BCA\u65AD \u2500\u2500",
      "AudioContext \u652F\u6301 : " + (hasAC ? "\u662F" : "\u5426"),
      "boot \u8FC7           : " + Audio.isStarted(),
      "ctx.state        : " + Audio.state(),
      "\u5728\u54CD           : " + Audio.isPlaying(),
      "\u9759\u97F3           : " + Audio.isMuted(),
      "\u4E3B\u97F3\u91CF         : " + Audio.vol(),
      "\u6700\u540E\u4E00\u6B21\u9519\u8BEF  : " + Audio.lastError(),
      "\u4EA4\u4E92\u8FC7\u5417       : " + (interacted ? "\u662F" : "\u5426"),
      "\u9875\u9762\u6765\u6E90       : " + window.location.host
    ];
    dbgEl.textContent = lines.join("\n");
  }

  var interacted = false;
  function markInteracted() { interacted = true; refreshDebug(); }

  if (DEBUG) setInterval(refreshDebug, 400);

  /* -------------------------------------------------------------
     声音：**进页面就自动开**，不用点
     ------------------------------------------------------------- */
  Audio.boot();
  if (DEBUG) refreshDebug();

  var unlocked = false;
  function unlock() {
    interacted = true;
    if (unlocked && Audio.isPlaying()) return;
    Audio.resume();
    setTimeout(function () {
      if (Audio.isPlaying()) {
        unlocked = true;
        paintSnd();
      }
      if (DEBUG) refreshDebug();
    }, 80);
  }
  /* 把"解锁"绑到**几乎所有能算数的事件**上。
     浏览器的规定是：必须先有一次真实的用户激活（user activation）。
     规范里算数的有：pointerdown / pointerup / mousedown / mouseup /
     touchend / keydown / click。
     ——多绑几个，是为了让用户**随便怎么碰一下**都能解锁，
     而不是非得精准点在某个元素上。 */
  var UNLOCK_EVENTS = [
    "pointerdown", "pointerup", "mousedown", "mouseup",
    "touchstart", "touchend", "click", "keydown"
  ];
  for (var ui = 0; ui < UNLOCK_EVENTS.length; ui++) {
    document.addEventListener(UNLOCK_EVENTS[ui], unlock);
  }
  // 切回本页时再试一次（用户可能刚在别处点过，这时也许已经获得激活）
  document.addEventListener("visibilitychange", function () {
    if (!document[hiddenKey]) Audio.resume();
  });
  window.addEventListener("focus", function () { Audio.resume(); });

  /* 页面加载后短时间内多试几次。
     没有交互时这些都会被浏览器拒绝（正常），
     但如果用户之前常来这个站点（Chrome 的 MEI 达标），
     这里就能直接放起来 —— 那才是真正的"一打开就响"。
     重复调用没有副作用。 */
  var tries = 0;
  var retry = setInterval(function () {
    tries++;
    if (Audio.isPlaying() || tries > 12) { clearInterval(retry); return; }
    Audio.resume();
    if (DEBUG) refreshDebug();
  }, 500);

  /* 声音开关 —— 不再是"点我开启"，而是**关掉**用的。
     默认就响，想安静才点它。所以平时它很淡，不抢戏。 */
  var sndBtn = document.getElementById("snd");
  var hintEl = document.getElementById("hint");

  function paintSnd() {
    if (!sndBtn) return;
    var playing = Audio.isPlaying();
    sndBtn.firstChild.textContent = playing ? "\uD83D\uDD0A" : "\uD83D\uDD07";
    sndBtn.style.opacity = playing ? "" : ".75";   // 没响时亮一点，好找
  }

  /**
   * 根据真实音频状态决定要不要给提示。
   * 三种情况：
   *   响了            → 藏起来，什么都不说
   *   建好了但被挂起   → 提示"点一下屏幕"
   *   浏览器不支持     → 提示"不支持网页声音"，别让用户白等
   */
  function refreshHint() {
    if (!hintEl) return;
    if (Audio.isPlaying()) { hintEl.className = ""; return; }
    if (!Audio.isStarted()) {
      hintEl.textContent = "\u26A0\uFE0F 这个浏览器不支持网页发声";
      hintEl.className = "show";
      return;
    }
    hintEl.textContent = "\uD83D\uDD07 点一下屏幕就有声音";
    hintEl.className = "show";
  }

  if (sndBtn) {
    sndBtn.addEventListener("click", function (e) {
      e.stopPropagation();          // 别让它同时触发"炸一堆"
      e.preventDefault();
      Audio.toggle();
      paintSnd();
      refreshHint();
    });
  }

  // 1.6 秒后检查一次：如果还没响，就把提示浮出来
  setTimeout(refreshHint, 1600);
  // 再多检查几次（有些环境解锁慢）
  setTimeout(refreshHint, 3000);
  setTimeout(function () { paintSnd(); refreshHint(); }, 5000);

  var downEvt = ("onpointerdown" in window) ? "pointerdown" : "touchstart";
  document.addEventListener(downEvt, function (e) {
    var t = (e.touches && e.touches[0]) || e;
    if (sndBtn && e.target === sndBtn) return;    // 点按钮时别炸字
    burst(t.clientX || 0, t.clientY || 0);
    Audio.blip();
    // 交互之后马上再看一眼，响了就把提示收掉
    setTimeout(function () { paintSnd(); refreshHint(); }, 400);
  });

  // 首次真正响起来时，刷新一下按钮和提示
  var watch = setInterval(function () {
    if (Audio.isPlaying()) {
      paintSnd();
      refreshHint();
      clearInterval(watch);
    }
  }, 700);

  /* -------------------------------------------------------------
     省电 & 尺寸变化
     ------------------------------------------------------------- */
  var hiddenKey = (document.hidden !== undefined) ? "hidden" : "webkitHidden";
  document.addEventListener("visibilitychange", function () {
    if (document[hiddenKey]) stop(); else start();
  });

  var rt = null;
  window.addEventListener("resize", function () {
    if (rt) clearTimeout(rt);
    rt = setTimeout(function () {
      var kids = [].slice.call(body.children);
      for (var i = 0; i < kids.length; i++) {
        var c = String(kids[i].className || "");
        if (c.indexOf("bit") >= 0 || c.indexOf("deco") >= 0) {
          if (kids[i].parentNode) kids[i].parentNode.removeChild(kids[i]);
        }
      }
      rebuildLanes();
    }, 260);
  });

  start();

} catch (err) {
  var fb = document.getElementById("fallback");
  if (fb) fb.style.display = "flex";
}
</script>
</body>
